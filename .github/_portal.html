<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>工程资料库 Pro</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.44.0/tabler-icons.min.css">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --accent:#185FA5;--accent-light:#E6F1FB;
  --bg:#F5F4F0;--surface:#fff;
  --border:rgba(0,0,0,0.09);--border-strong:rgba(0,0,0,0.15);
  --text:#1a1a18;--muted:#888780;
  --font:'IBM Plex Mono','Courier New',monospace;
  --r:6px;--r-lg:8px;--sw:220px;--hh:50px;
}
@media(prefers-color-scheme:dark){:root{
  --bg:#1b1a18;--surface:#232220;
  --border:rgba(255,255,255,0.08);--border-strong:rgba(255,255,255,0.16);
  --text:#eceae6;--accent-light:#0c2a40;
}}
html,body{height:100%;overflow:hidden}
body{font-family:var(--font);background:var(--bg);color:var(--text);display:flex;flex-direction:column;font-size:13px;line-height:1.5}

/* Header */
header{height:var(--hh);background:var(--surface);border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 16px;gap:12px;flex-shrink:0;z-index:20}
.logo{display:flex;align-items:center;gap:7px;font-size:14px;font-weight:600;letter-spacing:-.4px;white-space:nowrap}
.logo i{color:var(--accent);font-size:20px}
.logo sub{font-size:9px;font-weight:400;color:var(--muted);letter-spacing:.05em;vertical-align:super}
.search-wrap{flex:1;max-width:380px;display:flex;align-items:center;gap:8px;background:var(--bg);border:1px solid var(--border-strong);border-radius:var(--r);padding:0 10px;height:32px}
.search-wrap i{color:var(--muted);font-size:15px;flex-shrink:0}
#searchInput{border:none;background:transparent;outline:none;font-family:var(--font);font-size:12px;color:var(--text);width:100%}
#searchInput::placeholder{color:var(--muted)}
.ext-filters{display:flex;gap:5px;margin-left:auto}
.ext-tag{padding:3px 9px;border-radius:4px;border:1px solid var(--border-strong);font-size:11px;cursor:pointer;background:var(--surface);color:var(--muted);transition:all .12s;user-select:none}
.ext-tag.active{background:var(--accent-light);border-color:#378ADD;color:var(--accent);font-weight:500}
.icon-btn{width:32px;height:32px;border-radius:var(--r);border:1px solid var(--border-strong);background:var(--surface);display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--muted);transition:background .12s}
.icon-btn:hover{background:var(--bg);color:var(--text)}

/* Layout */
.main{display:flex;flex:1;overflow:hidden}

/* Sidebar */
.sidebar{width:var(--sw);background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;overflow-y:auto;flex-shrink:0}
.sb-section{padding:6px 0;border-bottom:1px solid var(--border)}
.sb-label{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);padding:6px 14px 4px}
.tree-item{display:flex;align-items:center;gap:8px;padding:6px 14px;cursor:pointer;font-size:12px;color:var(--text);transition:background .1s;border-left:2px solid transparent}
.tree-item:hover{background:var(--bg)}
.tree-item.active{background:var(--accent-light);color:var(--accent);font-weight:500;border-left-color:var(--accent)}
.tree-item i{font-size:16px;color:var(--muted);flex-shrink:0}
.tree-item.active i{color:var(--accent)}
.tree-nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tree-cnt{margin-left:auto;font-size:10px;color:var(--muted);background:var(--bg);padding:1px 6px;border-radius:10px;flex-shrink:0}
.tree-item.active .tree-cnt{background:rgba(24,95,165,.12);color:var(--accent)}

/* Content */
.content{flex:1;display:flex;flex-direction:column;overflow:hidden}
.content-hdr{padding:10px 16px;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--border);background:var(--bg);flex-shrink:0}
.breadcrumb{display:flex;align-items:center;gap:5px;font-size:12px;color:var(--muted);flex:1}
.bc-cur{color:var(--text);font-weight:500}
.cnt-badge{font-size:11px;color:var(--muted);background:var(--border);padding:2px 8px;border-radius:10px}
.sort-sel{border:1px solid var(--border-strong);border-radius:var(--r);background:var(--surface);font-family:var(--font);font-size:11px;color:var(--text);padding:4px 8px;cursor:pointer;outline:none}

/* File list */
.list-wrap{flex:1;overflow-y:auto}
.file-list{padding:6px 12px 24px}
.sec-hdr{display:flex;align-items:center;gap:6px;font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);padding:10px 4px 6px;border-bottom:1px solid var(--border);margin-bottom:2px}
.sec-hdr i{font-size:13px}
.file-row{display:flex;align-items:center;gap:10px;padding:7px 8px;border-radius:var(--r);cursor:pointer;transition:background .1s;border-bottom:.5px solid var(--border)}
.file-row:last-child{border-bottom:none}
.file-row:hover{background:var(--surface)}
.f-icon{width:30px;height:30px;border-radius:5px;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:15px}
.ic-pdf{background:#FCEBEB;color:#A32D2D}
.ic-ibs{background:#E1F5EE;color:#0F6E56}
.ic-zip{background:#FAEEDA;color:#854F0B}
.ic-img{background:#EEEDFE;color:#534AB7}
.ic-dir{background:var(--accent-light);color:var(--accent)}
.ic-oth{background:var(--bg);color:var(--muted)}
.f-info{flex:1;min-width:0}
.f-name{font-size:12px;font-weight:500;letter-spacing:-.2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.f-path{font-size:11px;color:var(--muted);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cat-badge{padding:2px 7px;border-radius:3px;font-size:10px;font-weight:500;flex-shrink:0}
.b-DS{background:#E6F1FB;color:#185FA5}
.b-IB{background:#E1F5EE;color:#0F6E56}
.b-PC{background:#FAEEDA;color:#854F0B}
.b-TO{background:#EEEDFE;color:#534AB7}
.b-OT{background:#F1EFE8;color:#5F5E5A}
.f-size{font-size:11px;color:var(--muted);width:60px;text-align:right;flex-shrink:0}
.f-date{font-size:11px;color:var(--muted);width:86px;text-align:right;flex-shrink:0}
.new-b{font-size:9px;background:#E1F5EE;color:#0F6E56;padding:1px 5px;border-radius:3px;flex-shrink:0;font-weight:600;letter-spacing:.05em}

/* Empty */
.empty{padding:48px 16px;text-align:center;color:var(--muted)}
.empty i{font-size:36px;display:block;margin-bottom:10px}

/* Preview */
.preview{width:0;min-width:0;background:var(--surface);border-left:1px solid var(--border);transition:width .2s,min-width .2s;overflow:hidden;flex-shrink:0;display:flex;flex-direction:column}
.preview.open{width:260px;min-width:260px}
.pv-hdr{padding:10px 12px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:8px;flex-shrink:0}
.pv-title{flex:1;font-size:12px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.close-btn{cursor:pointer;color:var(--muted);font-size:16px;line-height:1;flex-shrink:0}
.close-btn:hover{color:var(--text)}
.pv-body{flex:1;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:10px}
.pv-thumb{background:var(--bg);border-radius:var(--r-lg);height:150px;display:flex;align-items:center;justify-content:center;border:1px dashed var(--border-strong);flex-shrink:0;overflow:hidden}
.pv-thumb i{font-size:44px;color:var(--muted)}
.pv-thumb img{width:100%;height:100%;object-fit:contain}
.meta-grid{display:flex;flex-direction:column;gap:6px}
.meta-row{display:flex;justify-content:space-between;align-items:center;font-size:11px}
.meta-row span:first-child{color:var(--muted)}
.meta-row span:last-child{font-weight:500}
.pv-actions{display:flex;flex-direction:column;gap:6px;margin-top:4px}
.btn{display:flex;align-items:center;justify-content:center;gap:6px;padding:8px 12px;border-radius:var(--r);border:1px solid var(--border-strong);font-family:var(--font);font-size:12px;cursor:pointer;transition:background .1s;text-decoration:none}
.btn-p{background:var(--accent);border-color:var(--accent);color:#fff}
.btn-p:hover{background:#0C447C}
.btn-g{background:var(--surface);color:var(--text)}
.btn-g:hover{background:var(--bg)}

/* Recent bar */
.recent-bar{padding:6px 12px;background:var(--surface);border-top:1px solid var(--border);display:flex;align-items:center;gap:8px;font-size:11px;color:var(--muted);flex-shrink:0;overflow-x:auto}
.recent-bar::-webkit-scrollbar{display:none}
.r-chip{display:flex;align-items:center;gap:5px;padding:3px 9px;border-radius:4px;background:var(--bg);border:1px solid var(--border);cursor:pointer;color:var(--text);white-space:nowrap;transition:background .1s;flex-shrink:0}
.r-chip:hover{background:var(--border)}
.r-chip i{font-size:13px;color:var(--muted)}

/* Loading spinner */
.spin{animation:spin 1s linear infinite;display:inline-block}
@keyframes spin{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}

/* Scrollbar */
::-webkit-scrollbar{width:5px;height:5px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--border-strong);border-radius:3px}

@media(max-width:640px){
  .sidebar{display:none}
  .f-date,.f-size{display:none}
  .preview.open{width:100%;position:absolute;top:var(--hh);bottom:36px;right:0;z-index:15}
}
</style>
</head>
<body>

<header>
  <div class="logo"><i class="ti ti-circuit-board" aria-hidden="true"></i>工程资料库<sub>PRO</sub></div>
  <div class="search-wrap">
    <i class="ti ti-search" aria-hidden="true"></i>
    <input type="text" id="searchInput" placeholder="搜索文件名（模糊匹配）…" autocomplete="off" spellcheck="false">
    <i class="ti ti-x" id="clearSearch" style="cursor:pointer;display:none;color:var(--muted);font-size:14px" aria-hidden="true"></i>
  </div>
  <div class="ext-filters" id="extFilters">
    <div class="ext-tag active" data-ext="">全部</div>
    <div class="ext-tag" data-ext="pdf">PDF</div>
    <div class="ext-tag" data-ext="ibs">IBS</div>
    <div class="ext-tag" data-ext="zip">ZIP</div>
    <div class="ext-tag" data-ext="img">图片</div>
  </div>
  <div class="icon-btn" title="刷新目录" onclick="init()"><i class="ti ti-refresh" aria-hidden="true"></i></div>
</header>

<div class="main">
  <nav class="sidebar">
    <div class="sb-section">
      <div class="sb-label">目录树</div>
      <div class="tree-item active" data-folder="" onclick="selectFolder(this)">
        <i class="ti ti-layout-grid" aria-hidden="true"></i>
        <span class="tree-nm">全部文件</span>
        <span class="tree-cnt" id="cnt-all">…</span>
      </div>
      <div id="folderTree"></div>
    </div>
    <div class="sb-section">
      <div class="sb-label">分类标签</div>
      <div class="tree-item" data-cat="Datasheet" onclick="selectCat(this)">
        <i class="ti ti-file-description" aria-hidden="true"></i><span class="tree-nm">Datasheet</span><span class="tree-cnt" id="c-DS">0</span>
      </div>
      <div class="tree-item" data-cat="IBIS" onclick="selectCat(this)">
        <i class="ti ti-wave-sine" aria-hidden="true"></i><span class="tree-nm">IBIS</span><span class="tree-cnt" id="c-IB">0</span>
      </div>
      <div class="tree-item" data-cat="PCB" onclick="selectCat(this)">
        <i class="ti ti-circuit-board" aria-hidden="true"></i><span class="tree-nm">PCB</span><span class="tree-cnt" id="c-PC">0</span>
      </div>
      <div class="tree-item" data-cat="Tools" onclick="selectCat(this)">
        <i class="ti ti-tool" aria-hidden="true"></i><span class="tree-nm">Tools</span><span class="tree-cnt" id="c-TO">0</span>
      </div>
      <div class="tree-item" data-cat="Other" onclick="selectCat(this)">
        <i class="ti ti-tag" aria-hidden="true"></i><span class="tree-nm">Other</span><span class="tree-cnt" id="c-OT">0</span>
      </div>
    </div>
    <div class="sb-section">
      <div class="sb-label">最近更新</div>
      <div id="sbRecent"></div>
    </div>
  </nav>

  <div class="content">
    <div class="content-hdr">
      <div class="breadcrumb">
        <i class="ti ti-home" style="font-size:13px" aria-hidden="true"></i>
        <span>/</span><span class="bc-cur" id="folderLabel">全部文件</span>
      </div>
      <span class="cnt-badge" id="cntBadge">…</span>
      <select class="sort-sel" id="sortSel" onchange="render()">
        <option value="date">按更新时间</option>
        <option value="name">按文件名</option>
        <option value="size">按大小</option>
      </select>
    </div>
    <div class="list-wrap">
      <div class="file-list" id="fileList">
        <div class="empty"><i class="ti ti-loader spin" aria-hidden="true"></i><p>正在扫描目录…</p></div>
      </div>
    </div>
  </div>

  <aside class="preview" id="preview">
    <div class="pv-hdr">
      <span class="pv-title" id="pvTitle">选择文件预览</span>
      <span class="close-btn" onclick="document.getElementById('preview').classList.remove('open')"><i class="ti ti-x" aria-hidden="true"></i></span>
    </div>
    <div class="pv-body">
      <div class="pv-thumb" id="pvThumb"><i class="ti ti-file" style="font-size:44px" aria-hidden="true"></i></div>
      <div class="meta-grid">
        <div class="meta-row"><span>文件名</span><span id="pm-name" style="max-width:140px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">—</span></div>
        <div class="meta-row"><span>类型</span><span id="pm-type">—</span></div>
        <div class="meta-row"><span>大小</span><span id="pm-size">—</span></div>
        <div class="meta-row"><span>修改时间</span><span id="pm-date">—</span></div>
        <div class="meta-row"><span>分类</span><span id="pm-cat">—</span></div>
        <div class="meta-row"><span>路径</span><span id="pm-path" style="max-width:140px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:10px;color:var(--muted)">—</span></div>
      </div>
      <div class="pv-actions">
        <a class="btn btn-p" id="pvOpen" href="#" target="_blank"><i class="ti ti-eye" aria-hidden="true"></i>在线预览</a>
        <a class="btn btn-g" id="pvDown" href="#" download><i class="ti ti-download" aria-hidden="true"></i>下载文件</a>
      </div>
    </div>
  </aside>
</div>

<div class="recent-bar">
  <strong style="white-space:nowrap"><i class="ti ti-clock" aria-hidden="true"></i> 最近：</strong>
  <div id="recentChips" style="display:flex;gap:6px;overflow-x:auto"></div>
</div>

<script>
// ── 配置区 ────────────────────────────────────────────────────────
// 扩展名 → 分类（按需修改）
const EXT_CAT = {
  pdf:'Datasheet',
  ibs:'IBIS', ibis:'IBIS', s1p:'IBIS', s2p:'IBIS', s4p:'IBIS',
  sch:'PCB', brd:'PCB', kicad_pcb:'PCB', gbr:'PCB', drl:'PCB', kicad_sch:'PCB',
  zip:'Tools', rar:'Tools', '7z':'Tools', exe:'Tools', py:'Tools', sh:'Tools',
  png:'Other', jpg:'Other', jpeg:'Other', gif:'Other', svg:'Other', webp:'Other',
};
const CATS = ['Datasheet','IBIS','PCB','Tools','Other'];
const CAT_ID = {Datasheet:'DS',IBIS:'IB',PCB:'PC',Tools:'TO',Other:'OT'};
const IMG_EXTS = new Set(['png','jpg','jpeg','gif','webp','svg']);
const EXT_ICON = {
  pdf:'ti-file-type-pdf',
  ibs:'ti-wave-sine',ibis:'ti-wave-sine',s1p:'ti-wave-sine',s2p:'ti-wave-sine',s4p:'ti-wave-sine',
  zip:'ti-file-zip',rar:'ti-file-zip','7z':'ti-file-zip',
  png:'ti-photo',jpg:'ti-photo',jpeg:'ti-photo',gif:'ti-photo',svg:'ti-photo',webp:'ti-photo',
  py:'ti-brand-python',js:'ti-brand-javascript',sh:'ti-terminal',
  xlsx:'ti-file-spreadsheet',csv:'ti-file-spreadsheet',
  docx:'ti-file-word',doc:'ti-file-word',
  txt:'ti-file-text',md:'ti-markdown',
};
const EXT_CLR = {
  pdf:'ic-pdf',ibs:'ic-ibs',ibis:'ic-ibs',s1p:'ic-ibs',s2p:'ic-ibs',s4p:'ic-ibs',
  zip:'ic-zip',rar:'ic-zip','7z':'ic-zip',
  png:'ic-img',jpg:'ic-img',jpeg:'ic-img',gif:'ic-img',svg:'ic-img',webp:'ic-img',
};

// ── State ─────────────────────────────────────────────────────────
let allFiles=[], folders=[];
let fFolder='', fExt='', fCat='', searchQ='';

// ── Helpers ───────────────────────────────────────────────────────
const getExt = n => { const m=n.match(/\.([^.\/]+)$/); return m?m[1].toLowerCase():''; };
const getCat  = e => EXT_CAT[e]||'Other';
const getIcon = (e,d) => d?'ti-folder':(EXT_ICON[e]||'ti-file');
const getClr  = (e,d) => d?'ic-dir':(EXT_CLR[e]||'ic-oth');
const daysSince = d => { if(!d)return 9999; try{return Math.floor((Date.now()-new Date(d))/86400000);}catch{return 9999;}};

function parseSize(s){
  if(!s||s==='-')return -1;
  s=s.trim();
  const n=parseFloat(s); if(isNaN(n))return -1;
  if(/KB/i.test(s))return n*1024;
  if(/MB/i.test(s))return n*1048576;
  if(/GB/i.test(s))return n*1073741824;
  return n;
}

// ── Parser — reads the <table> format generated by jayanta525/github-pages-directory-listing
// Row format: <tr><td><img><a href="name">name</a></td><td>size</td><td>date</td></tr>
function parseListingHTML(html, baseHref){
  const doc = new DOMParser().parseFromString(html,'text/html');
  const items = [];
  doc.querySelectorAll('table tr').forEach(row=>{
    const tds = row.querySelectorAll('td');
    if(!tds.length) return;
    const a = tds[0].querySelector('a');
    if(!a) return;
    const href = a.getAttribute('href');
    if(!href||href==='../'||href==='./'||href.startsWith('?')||href.startsWith('#')) return;
    const isDir = href.endsWith('/');
    const rawSize = tds[1]?.textContent.trim()||'';
    const rawDate = tds[2]?.textContent.trim()||'';
    // Normalise date: "2026-06-07 04:05:25" → keep as is; strip trailing seconds if desired
    const date = rawDate.replace(/(\d{4}-\d{2}-\d{2}) (\d{2}:\d{2}):\d{2}/,'$1 $2');
    items.push({ href, isDir, size: rawSize==='- '||rawDate===rawSize?'':rawSize, date });
  });
  return items;
}

// ── Crawler ───────────────────────────────────────────────────────
// Base URL: e.g. https://zilong7728.github.io/FileDir
// BASE = 当前页面所在目录，末尾带 /
// 例：https://zilong7728.github.io/FileDir/ → 保持不变
// 例：https://zilong7728.github.io/FileDir/index.html → 截掉 index.html
const BASE = (()=>{
  let u = window.location.href;
  if(!u.endsWith('/')) u = u.substring(0, u.lastIndexOf('/') + 1);
  return u;
})();

// 把含中文/特殊字符的相对路径安全地 fetch
// href 可能已经是 URL-encoded（Action 生成的 <a href> 有时会编码）也可能是原始中文
async function safeFetch(base, relHref){
  // 先试原始拼接
  try{
    const r = await fetch(base + relHref);
    if(r.ok) return r;
  }catch{}
  // 再试 encode
  try{
    const encoded = relHref.split('/').map(seg=>encodeURIComponent(decodeURIComponent(seg))).join('/');
    const r = await fetch(base + encoded);
    if(r.ok) return r;
  }catch{}
  return null;
}

async function crawl(base, relPath, depth){
  if(depth>5) return;
  const r = await safeFetch(base, relPath);
  if(!r) return;
  const html = await r.text();

  const items = parseListingHTML(html, relPath);
  for(const item of items){
    if(item.isDir){
      const dirRel = relPath + item.href;          // e.g. "信号与电源完整性/"
      const dirKey = dirRel.replace(/\/$/,'');
      if(!folders.find(f=>f.rel===dirKey)){
        const label = decodeURIComponent(item.href.replace(/\/$/,''));
        folders.push({rel:dirKey, label});
      }
      await crawl(base, dirRel, depth+1);
    } else {
      const rawHref = item.href;                   // e.g. "foo.pdf" or "%E6%96%87%E4%BB%B6.pdf"
      const name = decodeURIComponent(rawHref.split('/').pop());
      const ext  = getExt(name);
      const cat  = getCat(ext);
      const folderRel = relPath.replace(/\/$/,'');
      // 构造可访问的 URL：把每段分别 encode
      const encodedHref = rawHref.split('/').map(seg=>{
        try{ return encodeURIComponent(decodeURIComponent(seg)); }
        catch{ return encodeURIComponent(seg); }
      }).join('/');
      allFiles.push({
        name, ext, cat,
        path: relPath + rawHref,
        folder: folderRel,
        size: item.size,
        sizeBytes: parseSize(item.size),
        date: item.date,
        days: daysSince(item.date),
        url: base + relPath + encodedHref,
      });
    }
  }
}

async function init(){
  allFiles=[]; folders=[];
  document.getElementById('fileList').innerHTML='<div class="empty"><i class="ti ti-loader spin" aria-hidden="true"></i><p>正在扫描目录…</p></div>';
  await crawl(BASE, '', 0);
  const recent = [...allFiles].sort((a,b)=>a.days-b.days);
  buildSidebar();
  updateCounts();
  render();
  renderRecentBar(recent.slice(0,6));
}

// ── Sidebar ───────────────────────────────────────────────────────
function buildSidebar(){
  document.getElementById('folderTree').innerHTML = folders.map(f=>`
    <div class="tree-item" data-folder="${f.rel}" onclick="selectFolder(this)">
      <i class="ti ti-folder" aria-hidden="true"></i>
      <span class="tree-nm">${f.label}</span>
      <span class="tree-cnt">${allFiles.filter(x=>x.folder===f.rel).length}</span>
    </div>`).join('');
}
function updateCounts(){
  document.getElementById('cnt-all').textContent = allFiles.length;
  CATS.forEach(c=>{
    const el=document.getElementById('c-'+CAT_ID[c]);
    if(el) el.textContent=allFiles.filter(f=>f.cat===c).length;
  });
  const recent=[...allFiles].sort((a,b)=>a.days-b.days);
  document.getElementById('sbRecent').innerHTML=recent.slice(0,5).map(f=>`
    <div class="tree-item" onclick='showPreview(${JSON.stringify(f).replace(/'/g,"&#39;")})'>
      <i class="ti ${getIcon(f.ext,false)}" aria-hidden="true"></i>
      <span class="tree-nm">${f.name}</span>
      <span class="tree-cnt">${f.days===0?'今天':f.days+'d'}</span>
    </div>`).join('');
}
function selectFolder(el){
  document.querySelectorAll('.tree-item').forEach(x=>x.classList.remove('active'));
  el.classList.add('active');
  fFolder=el.dataset.folder||'';
  fCat='';
  document.getElementById('folderLabel').textContent=
    el.dataset.folder===''?'全部文件':(folders.find(f=>f.rel===el.dataset.folder)?.label||el.dataset.folder);
  render();
}
function selectCat(el){
  document.querySelectorAll('.tree-item').forEach(x=>x.classList.remove('active'));
  el.classList.add('active');
  fCat=el.dataset.cat; fFolder='';
  document.getElementById('folderLabel').textContent=el.dataset.cat+' 分类';
  render();
}

// ── Render ────────────────────────────────────────────────────────
function getFiltered(){
  return allFiles.filter(f=>{
    if(fFolder && f.folder!==fFolder) return false;
    if(fCat && f.cat!==fCat) return false;
    if(fExt){
      if(fExt==='img') return IMG_EXTS.has(f.ext);
      if(f.ext!==fExt) return false;
    }
    if(searchQ){
      const q=searchQ.toLowerCase(), n=f.name.toLowerCase();
      let qi=0;
      for(let ni=0;ni<n.length&&qi<q.length;ni++) if(n[ni]===q[qi])qi++;
      if(qi<q.length) return false;
    }
    return true;
  });
}
function render(){
  const sort=document.getElementById('sortSel').value;
  let files=getFiltered();
  if(sort==='date') files.sort((a,b)=>a.days-b.days);
  else if(sort==='name') files.sort((a,b)=>a.name.localeCompare(b.name,'zh'));
  else files.sort((a,b)=>b.sizeBytes-a.sizeBytes);

  document.getElementById('cntBadge').textContent=files.length+' 个文件';
  const list=document.getElementById('fileList');
  if(!files.length){
    list.innerHTML='<div class="empty"><i class="ti ti-mood-empty" aria-hidden="true"></i><p>没有匹配的文件</p></div>';
    return;
  }
  let html='';
  if(!fCat&&!searchQ&&!fFolder){
    CATS.forEach(cat=>{
      const g=files.filter(f=>f.cat===cat);
      if(!g.length) return;
      html+=`<div class="sec-hdr"><i class="ti ti-tag" aria-hidden="true"></i>${cat}<span style="color:var(--border-strong);margin-left:4px">${g.length}</span></div>`;
      html+=g.map(rowHtml).join('');
    });
  } else {
    html=files.map(rowHtml).join('');
  }
  list.innerHTML=html;
}
function rowHtml(f){
  const isNew=f.days<=7;
  const enc=encodeURIComponent(JSON.stringify(f));
  return `<div class="file-row" onclick="showPreviewEnc('${enc}')">
    <div class="f-icon ${getClr(f.ext,false)}"><i class="ti ${getIcon(f.ext,false)}" aria-hidden="true"></i></div>
    <div class="f-info">
      <div class="f-name">${f.name}</div>
      <div class="f-path">${f.path}</div>
    </div>
    ${isNew?'<span class="new-b">NEW</span>':''}
    <span class="cat-badge b-${CAT_ID[f.cat]}">${f.cat}</span>
    <span class="f-size">${f.size||'—'}</span>
    <span class="f-date">${f.date?f.date.slice(0,10):'—'}</span>
  </div>`;
}
function showPreviewEnc(e){ showPreview(JSON.parse(decodeURIComponent(e))); }
function showPreview(f){
  document.getElementById('preview').classList.add('open');
  document.getElementById('pvTitle').textContent=f.name;
  document.getElementById('pm-name').textContent=f.name;
  document.getElementById('pm-type').textContent=(f.ext||'—').toUpperCase();
  document.getElementById('pm-size').textContent=f.size||'—';
  document.getElementById('pm-date').textContent=f.date?f.date.slice(0,10):'—';
  document.getElementById('pm-cat').textContent=f.cat;
  document.getElementById('pm-path').textContent=f.path;
  const thumb=document.getElementById('pvThumb');
  if(IMG_EXTS.has(f.ext)){
    thumb.innerHTML=`<img src="${f.url}" alt="${f.name}" onerror="this.parentNode.innerHTML='<i class=\\'ti ti-photo\\' style=\\'font-size:44px\\' aria-hidden=\\'true\\'></i>'">`;
  } else {
    thumb.innerHTML=`<i class="ti ${getIcon(f.ext,false)}" style="font-size:44px" aria-hidden="true"></i>`;
  }
  const pvOpen=document.getElementById('pvOpen');
  const pvDown=document.getElementById('pvDown');
  if(f.ext==='pdf'){pvOpen.href=f.url;pvOpen.style.display='flex';}
  else pvOpen.style.display='none';
  pvDown.href=f.url; pvDown.download=f.name;
}

// ── Recent bar ────────────────────────────────────────────────────
function renderRecentBar(files){
  document.getElementById('recentChips').innerHTML=files.map(f=>
    `<div class="r-chip" onclick='showPreview(${JSON.stringify(f).replace(/'/g,"&#39;")})'>
      <i class="ti ${getIcon(f.ext,false)}" aria-hidden="true"></i>${f.name}
    </div>`).join('');
}

// ── Search ────────────────────────────────────────────────────────
const si=document.getElementById('searchInput');
const cb=document.getElementById('clearSearch');
si.addEventListener('input',e=>{searchQ=e.target.value;cb.style.display=searchQ?'block':'none';render();});
cb.onclick=()=>{si.value='';searchQ='';cb.style.display='none';render();};
document.getElementById('extFilters').addEventListener('click',e=>{
  const t=e.target.closest('.ext-tag'); if(!t)return;
  document.querySelectorAll('.ext-tag').forEach(x=>x.classList.remove('active'));
  t.classList.add('active'); fExt=t.dataset.ext; render();
});

init();
</script>
</body>
</html>
