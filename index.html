<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>工程资料库 Pro</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.44.0/tabler-icons.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/styles/github.min.css">
<script src="https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/highlight.min.js"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --accent:#185FA5;--accent-light:#E6F1FB;
  --bg:#F5F4F0;--surface:#fff;
  --border:rgba(0,0,0,0.09);--border-strong:rgba(0,0,0,0.15);
  --text:#1a1a18;--muted:#888780;
  /* 修改为微软雅黑 */
  --font:'Microsoft YaHei','微软雅黑',sans-serif;
  --r:6px;--r-lg:8px;
  /* 稍微增加侧栏宽度和顶栏高度以适配大字号 */
  --sw:250px;--hh:54px;
}
@media(prefers-color-scheme:dark){:root{
  --bg:#1b1a18;--surface:#232220;
  --border:rgba(255,255,255,0.08);--border-strong:rgba(255,255,255,0.16);
  --text:#eceae6;--accent-light:#0c2a40;
}}
html,body{height:100%;overflow:hidden}
body{font-family:var(--font);background:var(--bg);color:var(--text);display:flex;flex-direction:column;font-size:14px;line-height:1.6}
header{height:var(--hh);background:var(--surface);border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 16px;gap:12px;flex-shrink:0;z-index:20}
.logo{display:flex;align-items:center;gap:7px;font-size:16px;font-weight:600;letter-spacing:-.4px;white-space:nowrap}
.logo i{color:var(--accent);font-size:22px}
.logo sub{font-size:11px;font-weight:400;color:var(--muted);letter-spacing:.05em;vertical-align:super}
.search-wrap{flex:1;max-width:380px;display:flex;align-items:center;gap:8px;background:var(--bg);border:1px solid var(--border-strong);border-radius:var(--r);padding:0 10px;height:34px}
.search-wrap i{color:var(--muted);font-size:16px;flex-shrink:0}
#searchInput{border:none;background:transparent;outline:none;font-family:var(--font);font-size:14px;color:var(--text);width:100%}
#searchInput::placeholder{color:var(--muted)}
.ext-filters{display:flex;gap:5px;margin-left:auto}
.ext-tag{padding:4px 10px;border-radius:4px;border:1px solid var(--border-strong);font-size:13px;cursor:pointer;background:var(--surface);color:var(--muted);transition:all .12s;user-select:none; text-transform: uppercase;}
.ext-tag.active{background:var(--accent-light);border-color:#378ADD;color:var(--accent);font-weight:500}
.icon-btn{width:34px;height:34px;border-radius:var(--r);border:1px solid var(--border-strong);background:var(--surface);display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--muted);transition:background .12s}
.icon-btn:hover{background:var(--bg);color:var(--text)}
.main{display:flex;flex:1;overflow:hidden}
.sidebar{width:var(--sw);background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;overflow-y:auto;flex-shrink:0}
.sb-section{padding:10px 0;border-bottom:1px solid var(--border)}
.sb-label{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);padding:0 14px 6px}

/* IDE Style Tree CSS */
.tree-item{display:flex;align-items:center;gap:6px;padding:5px 8px;cursor:pointer;font-size:14px;color:var(--text);transition:background .1s;border-radius:4px;margin:1px 8px;user-select:none;}
.tree-item:hover{background:var(--bg)}
.tree-item.active{background:var(--accent-light);color:var(--accent);font-weight:500;}
.tree-item i{font-size:16px;color:var(--muted);flex-shrink:0}
.tree-item.active i{color:var(--accent)}
.tree-nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;letter-spacing:-0.2px}
.tree-cnt{margin-left:auto;font-size:12px;color:var(--muted);background:var(--border);padding:2px 6px;border-radius:8px;flex-shrink:0}
.tree-item.active .tree-cnt{background:rgba(24,95,165,.15);color:var(--accent)}
.folder-arrow{width:20px;height:20px;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;border-radius:3px;}
.folder-arrow:hover{background:rgba(0,0,0,0.06)}
.folder-arrow i{font-size:16px;margin:0}
.folder-children{width:100%;padding-left:14px;}

.content{flex:1;display:flex;flex-direction:column;overflow:hidden}
.content-hdr{padding:12px 16px;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--border);background:var(--bg);flex-shrink:0}
.breadcrumb{display:flex;align-items:center;gap:5px;font-size:14px;color:var(--muted);flex:1;flex-wrap:wrap}
.breadcrumb i{cursor:pointer; font-size:16px;}
.breadcrumb .bc-cur{cursor:pointer;color:var(--text);font-weight:500}
.breadcrumb .bc-cur:hover{text-decoration:underline}
.cnt-badge{font-size:12px;color:var(--muted);background:var(--border);padding:3px 8px;border-radius:10px}
.sort-sel{border:1px solid var(--border-strong);border-radius:var(--r);background:var(--surface);font-family:var(--font);font-size:13px;color:var(--text);padding:4px 8px;cursor:pointer;outline:none}
.list-wrap{flex:1;overflow-y:auto}
.file-list{padding:6px 12px 24px}
.sec-hdr{display:flex;align-items:center;gap:6px;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);padding:10px 4px 6px;border-bottom:1px solid var(--border);margin-bottom:2px}
.sec-hdr i{font-size:15px}
.file-row{display:flex;align-items:center;gap:10px;padding:8px;border-radius:var(--r);cursor:pointer;transition:background .1s;border-bottom:.5px solid var(--border)}
.file-row:last-child{border-bottom:none}
.file-row:hover{background:var(--surface)}
.f-icon{width:34px;height:34px;border-radius:5px;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:18px}
.ic-pdf{background:#FCEBEB;color:#A32D2D}
.ic-ibs{background:#E1F5EE;color:#0F6E56}
.ic-zip{background:#FAEEDA;color:#854F0B}
.ic-img{background:#EEEDFE;color:#534AB7}
.ic-doc{background:#E6F1FB;color:#185FA5}
.ic-dir{background:var(--accent-light);color:var(--accent)}
.ic-oth{background:var(--bg);color:var(--muted)}
.f-info{flex:1;min-width:0}
.f-name{font-size:14px;font-weight:500;letter-spacing:-.2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.f-path{font-size:13px;color:var(--muted);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cat-badge{padding:3px 8px;border-radius:3px;font-size:11px;font-weight:600;flex-shrink:0; background:var(--border); color:var(--text); text-transform: uppercase;}
.f-size{font-size:13px;color:var(--muted);width:65px;text-align:right;flex-shrink:0}
.f-date{font-size:13px;color:var(--muted);width:90px;text-align:right;flex-shrink:0}
.new-b{font-size:11px;background:#E1F5EE;color:#0F6E56;padding:2px 6px;border-radius:3px;flex-shrink:0;font-weight:600;letter-spacing:.05em}
.empty{padding:48px 16px;text-align:center;color:var(--muted)}
.empty i{font-size:40px;display:block;margin-bottom:10px}
/* ── Modal 遮罩 ── */
.modal-overlay{
  display:none;position:fixed;inset:0;z-index:100;
  background:rgba(0,0,0,0.45);
  align-items:center;justify-content:center;
  padding:24px;
}
.modal-overlay.open{display:flex}
/* ── 弹窗本体 ── */
.preview{
  position:relative;
  background:var(--surface);
  border-radius:var(--r-lg);
  box-shadow:0 8px 40px rgba(0,0,0,0.22);
  display:flex;flex-direction:column;
  overflow:hidden;
  /* 代码/图片大文件用大尺寸，默认先给大的，info类靠内容自适应 */
  width:min(900px,90vw);
  height:min(680px,85vh);
  max-width:100%;max-height:100%;
}
/* 小模式：纯info（无代码无图片）时缩窄 */
.preview.pv-sm{width:min(420px,90vw);height:auto;max-height:80vh}
/* 顶部工具栏 */
.pv-hdr{
  padding:0 16px;height:46px;
  border-bottom:1px solid var(--border);
  display:flex;align-items:center;gap:10px;flex-shrink:0;
  background:var(--bg);border-radius:var(--r-lg) var(--r-lg) 0 0;
}
.pv-hdr-left{display:flex;align-items:center;gap:8px;flex:1;min-width:0}
.pv-hdr-left i{color:var(--muted);font-size:18px;flex-shrink:0}
.pv-title{font-size:14px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--text)}
.pv-hdr-meta{display:flex;align-items:center;gap:5px;flex-shrink:0}
.pv-meta-chip{font-size:12px;color:var(--muted);background:var(--border);padding:2px 8px;border-radius:4px;white-space:nowrap}
.close-btn{cursor:pointer;color:var(--muted);font-size:18px;flex-shrink:0;width:28px;height:28px;display:flex;align-items:center;justify-content:center;border-radius:4px;transition:background .1s}
.close-btn:hover{background:rgba(0,0,0,0.07);color:var(--text)}
/* 内容区 */
.pv-body{flex:1;overflow:hidden;display:flex;min-height:0}
.pv-main{flex:1;overflow:auto;display:flex;flex-direction:column;min-width:0}
.pv-thumb{flex:1;display:flex;align-items:center;justify-content:center;overflow:auto;min-height:0;padding:0}
.pv-thumb>i{font-size:72px;color:var(--muted)}
.pv-thumb img{max-width:100%;max-height:100%;object-fit:contain;padding:16px}
.pv-thumb pre{margin:0;width:100%;min-height:100%;background:var(--bg)}
.pv-thumb pre code{font-size:14px;line-height:1.65;padding:20px 24px;display:block;font-family:'Cascadia Code','Fira Code','Consolas',monospace}
/* 右侧 info 栏 */
.pv-info{width:210px;flex-shrink:0;border-left:1px solid var(--border);overflow-y:auto;display:flex;flex-direction:column}
.pv-sm .pv-info{width:100%;border-left:none}
.pv-info-section{padding:14px 16px;border-bottom:1px solid var(--border)}
.pv-info-label{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:10px}
.meta-grid{display:flex;flex-direction:column;gap:10px}
.meta-row{display:flex;flex-direction:column;gap:2px;font-size:13px}
.meta-row .mk{color:var(--muted);font-size:12px}
.meta-row .mv{font-weight:500;word-break:break-all}
.pv-actions{padding:14px 16px;display:flex;flex-direction:column;gap:8px;margin-top:auto}
.btn{display:flex;align-items:center;justify-content:center;gap:6px;padding:9px 12px;border-radius:var(--r);border:1px solid var(--border-strong);font-family:var(--font);font-size:14px;cursor:pointer;transition:background .1s;text-decoration:none}
.btn-p{background:var(--accent);border-color:var(--accent);color:#fff}
.btn-p:hover{background:#0C447C}
.btn-g{background:var(--surface);color:var(--text)}
.btn-g:hover{background:var(--bg)}
.recent-bar{padding:8px 14px;background:var(--surface);border-top:1px solid var(--border);display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted);flex-shrink:0;overflow-x:auto}
.recent-bar::-webkit-scrollbar{display:none}
.r-chip{display:flex;align-items:center;gap:5px;padding:4px 10px;border-radius:4px;background:var(--bg);border:1px solid var(--border);cursor:pointer;color:var(--text);white-space:nowrap;transition:background .1s;flex-shrink:0}
.r-chip:hover{background:var(--border)}
.r-chip i{font-size:15px;color:var(--muted)}
.spin{animation:spin 1s linear infinite;display:inline-block}
@keyframes spin{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--border-strong);border-radius:3px}
@media(max-width:640px){
  .sidebar{display:none}
  .f-date,.f-size{display:none}
  .preview.open{left:0!important}
}
</style>
</head>
<body>

<header>
  <div class="logo"><i class="ti ti-circuit-board"></i>工程资料库<sub>PRO</sub></div>
  <div class="search-wrap">
    <i class="ti ti-search"></i>
    <input type="text" id="searchInput" placeholder="搜索文件名（模糊匹配）…" autocomplete="off" spellcheck="false">
    <i class="ti ti-x" id="clearSearch" style="cursor:pointer;display:none;color:var(--muted);font-size:16px"></i>
  </div>
  <div class="ext-filters" id="extFilters">
    </div>
  <div class="icon-btn" title="刷新目录" onclick="init()"><i class="ti ti-refresh"></i></div>
</header>

<div class="main">
  <nav class="sidebar">
    <div class="sb-section">
      <div class="sb-label">全库概览</div>
      <div class="tree-item active" data-folder="ALL" onclick="selectAllFiles()">
        <span class="folder-arrow" style="visibility:hidden"></span>
        <i class="ti ti-layers-linked"></i>
        <span class="tree-nm">全部文件 (全局)</span>
        <span class="tree-cnt" id="cnt-all">…</span>
      </div>
    </div>

    <div class="sb-section">
      <div class="sb-label">资源管理器</div>
      <div id="folderTree"></div>
    </div>
    
    <div class="sb-section" id="catSection">
      </div>
  </nav>

  <div class="content">
    <div class="content-hdr">
      <div class="breadcrumb" id="breadcrumb">
        </div>
      <span class="cnt-badge" id="cntBadge">…</span>
      <select class="sort-sel" id="sortSel" onchange="render()">
        <option value="date">按更新时间</option>
        <option value="name">按文件名</option>
        <option value="size">按大小</option>
      </select>
    </div>
    <div class="list-wrap">
      <div class="file-list" id="fileList">
        <div class="empty"><i class="ti ti-loader spin"></i><p>正在加载目录…</p></div>
      </div>
    </div>
  </div>

  <div class="modal-overlay" id="modalOverlay" onclick="handleOverlayClick(event)">
  <aside class="preview" id="preview">
    <div class="pv-hdr">
      <div class="pv-hdr-left">
        <i class="ti ti-file" id="pvHeaderIcon"></i>
        <span class="pv-title" id="pvTitle">选择文件预览</span>
      </div>
      <div class="pv-hdr-meta">
        <span class="pv-meta-chip" id="pm-type-chip">—</span>
        <span class="pv-meta-chip" id="pm-size-chip">—</span>
        <span class="pv-meta-chip" id="pm-date-chip">—</span>
      </div>
      <span class="close-btn" title="关闭预览" onclick="closePreview()"><i class="ti ti-x"></i></span>
    </div>
    <div class="pv-body">
      <div class="pv-main">
        <div class="pv-thumb" id="pvThumb"><i class="ti ti-file"></i></div>
      </div>
      <div class="pv-info">
        <div class="pv-info-section">
          <div class="pv-info-label">文件信息</div>
          <div class="meta-grid">
            <div class="meta-row"><span class="mk">文件名</span><span class="mv" id="pm-name">—</span></div>
            <div class="meta-row"><span class="mk">类型</span><span class="mv" id="pm-type">—</span></div>
            <div class="meta-row"><span class="mk">大小</span><span class="mv" id="pm-size">—</span></div>
            <div class="meta-row"><span class="mk">修改时间</span><span class="mv" id="pm-date">—</span></div>
            <div class="meta-row"><span class="mk">路径</span><span class="mv" id="pm-path" style="font-size:12px;color:var(--muted)">—</span></div>
          </div>
        </div>
        <div class="pv-actions">
          <a class="btn btn-p" id="pvOpen" href="#" target="_blank"><i class="ti ti-eye"></i>在线预览</a>
          <a class="btn btn-g" id="pvDown" href="#" download><i class="ti ti-download"></i>下载文件</a>
        </div>
      </div>
    </div>
  </aside>
  </div>
</div>

<div class="recent-bar">
  <strong style="white-space:nowrap"><i class="ti ti-clock"></i> 最近：</strong>
  <div id="recentChips" style="display:flex;gap:6px;overflow-x:auto"></div>
</div>

<script>
// ── 配置区 ────────────────────────────────────────────────────────
const IMG_EXTS = new Set(['png','jpg','jpeg','gif','webp','svg']);
const OFFICE_EXTS = new Set(['doc','docx','xls','xlsx','ppt','pptx','csv']);

// 💡 扩展原生直接跳页查看的格式，将音视频和基础文本加入
const DIRECT_EXTS = new Set(['pdf','txt','md','mp4','webm','ogv','mp3','wav','ogg','m4a']); 

// 💡 新增：音视频原生解算后缀分类
const VIDEO_EXTS = new Set(['mp4', 'webm', 'ogv']);
const AUDIO_EXTS = new Set(['mp3', 'wav', 'ogg', 'm4a']);

// 需要直接在高亮卡片里渲染的代码和文本格式
const CODE_EXTS = new Set(['py','il','cxt','yml','json','js','sh','html','css','c','cpp','txt','md','xml','log']);

const EXT_ICON = {
  pdf:'ti-file-type-pdf',
  ibs:'ti-wave-sine', ibis:'ti-wave-sine', s1p:'ti-wave-sine', s2p:'ti-wave-sine', s4p:'ti-wave-sine',
  zip:'ti-file-zip', rar:'ti-file-zip', '7z':'ti-file-zip',
  png:'ti-photo', jpg:'ti-photo', jpeg:'ti-photo', gif:'ti-photo', svg:'ti-photo', webp:'ti-photo',
  py:'ti-brand-python', js:'ti-brand-javascript', sh:'ti-terminal', exe:'ti-device-desktop',
  xlsx:'ti-file-spreadsheet', csv:'ti-file-spreadsheet',
  docx:'ti-file-word', doc:'ti-file-word',
  txt:'ti-file-text', md:'ti-markdown', db:'ti-database',
  mp4:'ti-video', webm:'ti-video', ogv:'ti-video',
  mp3:'ti-volume', wav:'ti-volume', m4a:'ti-volume'
};
const EXT_CLR = {
  pdf:'ic-pdf', ibs:'ic-ibs', ibis:'ic-ibs', s1p:'ic-ibs', s2p:'ic-ibs', s4p:'ic-ibs',
  zip:'ic-zip', rar:'ic-zip', '7z':'ic-zip',
  png:'ic-img', jpg:'ic-img', jpeg:'ic-img', gif:'ic-img', svg:'ic-img', webp:'ic-img',
  docx:'ic-doc', doc:'ic-doc', txt:'ic-doc'
};

let allFiles = [];
let allFolderPaths = []; 
let fFolder = null; // null: 全局全部文件, "": 物理根目录, "path": 子目录
let sideExt = ''; 
let topExt = '';  
let searchQ = '';

// 辅助函数
const getIcon = (e, d) => d ? 'ti-folder' : (EXT_ICON[e] || 'ti-file');
const getClr = (e, d) => d ? 'ic-dir' : (EXT_CLR[e] || 'ic-oth');
const daysSince = d => { if (!d) return 9999; try { return Math.floor((Date.now() - new Date(d)) / 86400000); } catch { return 9999; } };
function escapeHtml(str) { return str.replace(/[&<>]/g, m => m === '&' ? '&amp;' : (m === '<' ? '&lt;' : '&gt;')); }
function parseSize(s) { if (!s || s === '-') return -1; const n = parseFloat(s); if (isNaN(n)) return -1; if (/KB/i.test(s)) return n * 1024; if (/MB/i.test(s)) return n * 1048576; if (/GB/i.test(s)) return n * 1073741824; return n; }

// 核心修复：获取直系子文件夹（支持完整全量树）
function getSubFolders(currentFolder) {
  if (currentFolder === "") {
    return allFolderPaths.filter(p => !p.includes('/') && p !== "");
  } else {
    return allFolderPaths.filter(p => {
      const lastSlashIndex = p.lastIndexOf('/');
      if (lastSlashIndex === -1) return false;
      const parent = p.substring(0, lastSlashIndex);
      return parent === currentFolder;
    });
  }
}

// IDE风格：递归渲染目录结构（同时渲染文件夹和文件）
function renderTreeLevel(currentFolder) {
  let html = '';
  const subFolders = getSubFolders(currentFolder);
  const files = allFiles.filter(f => f.folder === currentFolder);

  // 1. 渲染子文件夹
  for (const sub of subFolders) {
    const name = sub.split('/').pop();
    const safeId = sub.replace(/\//g, '-');
    const subSub = getSubFolders(sub);
    const filesHere = allFiles.filter(f => f.folder === sub);
    const hasChildren = subSub.length > 0 || filesHere.length > 0;
    const arrowStyle = hasChildren ? 'visibility: visible;' : 'visibility: hidden;';
    
    html += `
    <div class="tree-folder" data-folder-path="${sub}">
      <div class="tree-item" data-folder="${sub}" onclick="selectFolderByPath('${sub}')">
        <span class="folder-arrow" onclick="event.stopPropagation(); toggleFolder('${sub}')" style="${arrowStyle}">
          <i class="ti ti-chevron-right" id="arrow-${safeId}"></i>
        </span>
        <i class="ti ti-folder" style="color: var(--accent);"></i>
        <span class="tree-nm" style="text-transform: none;">${escapeHtml(name)}</span>
      </div>
      <div class="folder-children" id="children-${safeId}" style="display: none;">
        ${renderTreeLevel(sub)}
      </div>
    </div>`;
  }

  // 2. 渲染当前目录下的文件（无箭头，靠占位对齐）
  for (const f of files) {
    const enc = encodeURIComponent(JSON.stringify(f));
    html += `
    <div class="tree-item" onclick="showPreviewEnc('${enc}')" title="${escapeHtml(f.name)}">
      <span class="folder-arrow" style="visibility: hidden;"></span>
      <i class="ti ${getIcon(f.ext, false)}" style="font-size: 16px; color: var(--muted)"></i>
      <span class="tree-nm" style="text-transform: none; font-size: 13px; opacity: 0.9">${escapeHtml(f.name)}</span>
    </div>`;
  }
  return html;
}

function buildSidebar() {
  const container = document.getElementById('folderTree');
  let html = `
  <div class="tree-folder" data-folder-path="">
    <div class="tree-item" data-folder="" onclick="selectFolderByPath('')">
      <span class="folder-arrow" onclick="event.stopPropagation(); toggleFolder('')" style="visibility: visible;">
        <i class="ti ti-chevron-down" id="arrow-root"></i>
      </span>
      <i class="ti ti-server" style="color: var(--accent)"></i>
      <span class="tree-nm" style="font-weight: 500;">/ (根目录)</span>
    </div>
    <div class="folder-children" id="children-root" style="display: block;">
      ${renderTreeLevel("")}
    </div>
  </div>`;
  container.innerHTML = html;
}

function buildCatSidebar() {
  const exts = [...new Set(allFiles.map(f => f.ext).filter(e => e !== ''))].sort();
  let html = '<div class="sb-label" style="margin-top:10px">按后缀分类</div>';
  exts.forEach(ext => {
    const cnt = allFiles.filter(f => f.ext === ext).length;
    html += `
      <div class="tree-item" data-ext-side="${ext}" onclick="selectSideExt(this)">
        <span class="folder-arrow" style="visibility:hidden"></span>
        <i class="ti ${getIcon(ext, false)}"></i>
        <span class="tree-nm" style="text-transform: uppercase;">${ext}</span>
        <span class="tree-cnt">${cnt}</span>
      </div>`;
  });
  document.getElementById('catSection').innerHTML = html;
}

function buildTopExtFilters() {
  const extCounts = {};
  allFiles.forEach(f => { if(f.ext) extCounts[f.ext] = (extCounts[f.ext] || 0) + 1; });
  const sortedExts = Object.entries(extCounts).sort((a,b) => b[1] - a[1]).slice(0, 5).map(x => x[0]);
  
  let html = `<div class="ext-tag active" data-ext-top="">全部</div>`;
  sortedExts.forEach(ext => {
    html += `<div class="ext-tag" data-ext-top="${ext}">${ext}</div>`;
  });
  document.getElementById('extFilters').innerHTML = html;
}

function toggleFolder(folderPath) {
  const safeId = folderPath === "" ? "root" : folderPath.replace(/\//g, '-');
  const childrenDiv = document.getElementById(`children-${safeId}`);
  const arrowIcon = document.getElementById(`arrow-${safeId}`);
  if (!childrenDiv || !arrowIcon) return;
  const isVisible = childrenDiv.style.display !== 'none';
  childrenDiv.style.display = isVisible ? 'none' : 'block';
  arrowIcon.classList.toggle('ti-chevron-right', isVisible);
  arrowIcon.classList.toggle('ti-chevron-down', !isVisible);
}

function expandToFolder(folderPath) {
  const rootChild = document.getElementById(`children-root`);
  const rootArrow = document.getElementById(`arrow-root`);
  if (rootChild) rootChild.style.display = 'block';
  if (rootArrow) { rootArrow.classList.remove('ti-chevron-right'); rootArrow.classList.add('ti-chevron-down'); }

  if (folderPath === "" || folderPath === null) return;
  
  const parts = folderPath.split('/');
  let currentPath = '';
  for (let i = 0; i < parts.length; i++) {
    currentPath += (i === 0 ? parts[i] : '/' + parts[i]);
    const safeId = currentPath.replace(/\//g, '-');
    const childrenDiv = document.getElementById(`children-${safeId}`);
    const arrowIcon = document.getElementById(`arrow-${safeId}`);
    if (childrenDiv && childrenDiv.style.display === 'none') {
      childrenDiv.style.display = 'block';
      if (arrowIcon) {
        arrowIcon.classList.remove('ti-chevron-right');
        arrowIcon.classList.add('ti-chevron-down');
      }
    }
  }
}

function updateBreadcrumb() {
  const container = document.getElementById('breadcrumb');
  if (fFolder === null) {
    container.innerHTML = '<span class="bc-cur" onclick="selectAllFiles()">全部文件 (全局)</span>';
    return;
  }
  
  let html = '<span class="bc-cur" onclick="selectFolderByPath(\'\')">根目录</span>';
  if (fFolder !== "") {
    const parts = fFolder.split('/');
    let accumulated = '';
    for (let i = 0; i < parts.length; i++) {
      html += '<span class="sep"> / </span>';
      accumulated += (i === 0 ? parts[i] : '/' + parts[i]);
      html += `<span class="bc-cur" onclick="selectFolderByPath('${accumulated}')">${escapeHtml(parts[i])}</span>`;
    }
  }
  container.innerHTML = html;
}

function getCurrentItems() {
  let files = allFiles.filter(f => {
    if (fFolder !== null && f.folder !== fFolder) return false;
    if (sideExt && f.ext !== sideExt) return false;
    if (topExt && f.ext !== topExt) return false;
    if (searchQ) {
      const q = searchQ.toLowerCase(), n = f.name.toLowerCase();
      let idx = 0;
      for (let i = 0; i < n.length && idx < q.length; i++) if (n[i] === q[idx]) idx++;
      if (idx < q.length) return false;
    }
    return true;
  });

  let subFolders = [];
  if (!searchQ && !sideExt && !topExt && fFolder !== null) {
    subFolders = getSubFolders(fFolder).map(sub => ({
      isDir: true, name: sub.split('/').pop(), fullPath: sub, size: '', date: '', ext: '',
    }));
  }
  return [...subFolders, ...files];
}

function render() {
  const sort = document.getElementById('sortSel').value;
  let items = getCurrentItems();
  items.sort((a, b) => {
    if (a.isDir && !b.isDir) return -1;
    if (!a.isDir && b.isDir) return 1;
    if (sort === 'date') return (a.date || '').localeCompare(b.date || '');
    if (sort === 'name') return (a.name || '').localeCompare(b.name || '', 'zh');
    if (sort === 'size') return (b.sizeBytes || 0) - (a.sizeBytes || 0);
    return 0;
  });
  document.getElementById('cntBadge').textContent = items.length + ' 个项目';
  const listDiv = document.getElementById('fileList');
  if (!items.length) {
    listDiv.innerHTML = '<div class="empty"><i class="ti ti-mood-empty"></i><p>无匹配文件</p></div>';
    return;
  }
  let html = '';
  
  if (fFolder === null && !sideExt && !searchQ && !topExt) {
    const fileItems = items.filter(i => !i.isDir);
    const uniqueExts = [...new Set(fileItems.map(f => f.ext).filter(e => e !== ''))].sort();
    for (const ext of uniqueExts) {
      const g = fileItems.filter(f => f.ext === ext);
      if (!g.length) continue;
      html += `<div class="sec-hdr"><i class="ti ${getIcon(ext, false)}"></i>${ext}<span style="color:var(--border-strong);margin-left:4px">${g.length}</span></div>`;
      html += g.map(rowHtml).join('');
    }
    const gOther = fileItems.filter(f => f.ext === '');
    if(gOther.length) {
      html += `<div class="sec-hdr"><i class="ti ti-file"></i>未知格式<span style="color:var(--border-strong);margin-left:4px">${gOther.length}</span></div>`;
      html += gOther.map(rowHtml).join('');
    }
  } else {
    html = items.map(rowHtml).join('');
  }
  listDiv.innerHTML = html;
}

function rowHtml(item) {
  if (item.isDir) {
    return `<div class="file-row" onclick="selectFolderByPath('${item.fullPath}')">
      <div class="f-icon ic-dir"><i class="ti ti-folder"></i></div>
      <div class="f-info">
        <div class="f-name">${escapeHtml(item.name)}</div>
        <div class="f-path">${escapeHtml(item.fullPath)}</div>
      </div>
      <span class="cat-badge" style="background:transparent;border:1px solid var(--border)">文件夹</span>
      <span class="f-size"></span>
      <span class="f-date"></span>
    </div>`;
  }
  const isNew = item.days <= 7;
  const enc = encodeURIComponent(JSON.stringify(item));
  const displayExt = item.ext ? item.ext : '未知';
  return `<div class="file-row" onclick="showPreviewEnc('${enc}')">
    <div class="f-icon ${getClr(item.ext,false)}"><i class="ti ${getIcon(item.ext,false)}"></i></div>
    <div class="f-info">
      <div class="f-name">${escapeHtml(item.name)}</div>
      <div class="f-path">${escapeHtml(item.path)}</div>
    </div>
    ${isNew ? '<span class="new-b">NEW</span>' : ''}
    <span class="cat-badge">${displayExt}</span>
    <span class="f-size">${item.size || '—'}</span>
    <span class="f-date">${item.date ? item.date.slice(0,10) : '—'}</span>
  </div>`;
}

function selectAllFiles() {
  fFolder = null; sideExt = ''; topExt = ''; searchQ = '';
  document.getElementById('searchInput').value = '';
  document.getElementById('clearSearch').style.display = 'none';
  
  updateBreadcrumb();
  document.querySelectorAll('.tree-item').forEach(el => el.classList.remove('active'));
  document.querySelector('.tree-item[data-folder="ALL"]').classList.add('active');
  render();
}

function selectFolderByPath(folderPath) {
  fFolder = folderPath; sideExt = ''; searchQ = '';
  document.getElementById('searchInput').value = '';
  document.getElementById('clearSearch').style.display = 'none';
  
  updateBreadcrumb();
  document.querySelectorAll('.tree-item').forEach(el => el.classList.remove('active'));
  let targetEl = document.querySelector(`.tree-item[data-folder="${folderPath}"]`);
  if (targetEl) { targetEl.classList.add('active'); expandToFolder(folderPath); }
  render();
}

function selectSideExt(el) {
  document.querySelectorAll('.tree-item').forEach(x => x.classList.remove('active'));
  el.classList.add('active');
  sideExt = el.dataset.extSide; fFolder = null; topExt = "";  
  document.querySelectorAll('.ext-tag').forEach(tag => tag.classList.remove('active'));
  document.querySelector('.ext-tag[data-ext-top=""]').classList.add('active');
  updateBreadcrumb(); render();
}

function showPreviewEnc(enc) { showPreview(JSON.parse(decodeURIComponent(enc))); }

function closePreview() {
  document.getElementById('modalOverlay').classList.remove('open');
  // 💡 安全释放：关闭弹窗时立刻斩断流媒体源，防止声音或视频在后台继续偷偷播放
  document.getElementById('pvThumb').innerHTML = '';
}

function handleOverlayClick(e) {
  if (e.target === document.getElementById('modalOverlay')) closePreview();
}

document.addEventListener('keydown', e => { if (e.key === 'Escape') closePreview(); });

async function showPreview(f) {
  f.url = new URL(f.url, window.location.href).href;
  const overlay = document.getElementById('modalOverlay');
  const pv = document.getElementById('preview');
  overlay.classList.add('open');

  // 💡 将音视频加入大视图特征集，确保多媒体打开时保持 900px 宽的极客大开屏
  const hasContent = IMG_EXTS.has(f.ext) || CODE_EXTS.has(f.ext) || VIDEO_EXTS.has(f.ext) || AUDIO_EXTS.has(f.ext);
  pv.classList.toggle('pv-sm', !hasContent);

  document.getElementById('pvTitle').textContent = f.name;
  const ext = (f.ext || '').toUpperCase() || '—';
  document.getElementById('pm-type-chip').textContent = ext;
  document.getElementById('pm-size-chip').textContent = f.size || '—';
  document.getElementById('pm-date-chip').textContent = f.date ? f.date.slice(0,10) : '—';
  document.getElementById('pm-name').textContent = f.name;
  document.getElementById('pm-type').textContent = ext;
  document.getElementById('pm-size').textContent = f.size || '—';
  document.getElementById('pm-date').textContent = f.date ? f.date.slice(0,10) : '—';
  document.getElementById('pm-path').textContent = f.path;
  document.getElementById('pvHeaderIcon').className = `ti ${getIcon(f.ext, false)}`;

  // 小模式隐藏左侧内容区
  pv.querySelector('.pv-main').style.display = hasContent ? '' : 'none';

  const thumb = document.getElementById('pvThumb');
  // 基础布局重置
  thumb.style.justifyContent = 'center';
  thumb.style.alignItems = 'center';
  thumb.style.background = 'transparent';

  if (IMG_EXTS.has(f.ext)) {
    thumb.innerHTML = `<img src="${f.url}" alt="${f.name}" onerror="this.parentNode.innerHTML='<i class=\\'ti ti-photo\\' style=\\'font-size:72px;color:var(--muted)\\'></i>'">`;
  } 
  // ── 💡 缝合：原生 MP4/WebM 视频在大遮罩层内的渲染 ──
  else if (VIDEO_EXTS.has(f.ext)) {
    thumb.style.background = '#000'; // 黑色大背景，强化影音暗房的高级感
    thumb.innerHTML = `<video src="${f.url}" controls preload="metadata" style="width:100%; height:100%; max-height:100%; object-fit:contain; outline:none;"></video>`;
  } 
  // ── 💡 缝合：原生 MP3/WAV 音频控制条渲染 ──
  else if (AUDIO_EXTS.has(f.ext)) {
    thumb.innerHTML = `
      <div style="padding:40px; width:100%; text-align:center; max-width:420px;">
        <i class="ti ti-volume" style="font-size:56px; color:var(--accent); display:block; margin-bottom:16px;"></i>
        <audio src="${f.url}" controls style="width:100%; outline:none;"></audio>
      </div>`;
  } 
  else if (CODE_EXTS.has(f.ext)) {
    thumb.style.justifyContent = 'flex-start';
    thumb.style.alignItems = 'flex-start';
    thumb.innerHTML = `<div style="padding:32px;width:100%;text-align:center;color:var(--muted);"><i class="ti ti-loader spin"></i> 正在拉取代码...</div>`;
    try {
      const resp = await fetch(f.url);
      if (!resp.ok) throw new Error('网络请求失败');
      const textContent = await resp.text();
      thumb.innerHTML = `<pre style="margin:0;width:100%;min-height:100%;background:var(--bg);"><code class="language-${f.ext}" style="padding:20px 24px;font-size:14px;line-height:1.65;background:transparent;border-radius:0;font-family:'Cascadia Code','Fira Code','Consolas',monospace;">${escapeHtml(textContent)}</code></pre>`;
      if (window.hljs) hljs.highlightElement(thumb.querySelector('code'));
    } catch (e) {
      thumb.innerHTML = `<div style="padding:32px;width:100%;text-align:center;color:#A32D2D;"><i class="ti ti-alert-circle"></i> 无法读取文件内容</div>`;
    }
  } else {
    thumb.innerHTML = `<i class="ti ${getIcon(f.ext,false)}" style="font-size:72px;color:var(--muted)"></i>`;
  }

  const pvOpen = document.getElementById('pvOpen');
  const pvDown = document.getElementById('pvDown');
  if (DIRECT_EXTS.has(f.ext)) {
    pvOpen.href = f.url; pvOpen.style.display = 'flex';
  } else if (OFFICE_EXTS.has(f.ext)) {
    const absoluteUrl = new URL(f.url, window.location.href).href;
    pvOpen.href = `https://view.officeapps.live.com/op/view.aspx?src=${encodeURIComponent(absoluteUrl)}`;
    pvOpen.style.display = 'flex';
  } else {
    pvOpen.style.display = 'none';
  }
  pvDown.href = f.url;
  pvDown.download = f.name;
}

function renderRecentBar(files) {
  document.getElementById('recentChips').innerHTML = files.map(f => `
    <div class="r-chip" onclick='showPreview(${JSON.stringify(f).replace(/'/g,"&#39;")})'>
      <i class="ti ${getIcon(f.ext,false)}"></i>${escapeHtml(f.name)}
    </div>
  `).join('');
}

function updateCounts() {
  document.getElementById('cnt-all').textContent = allFiles.length;
}

async function init() {
  allFiles = []; allFolderPaths = [];
  document.getElementById('fileList').innerHTML = '<div class="empty"><i class="ti ti-loader spin"></i><p>正在加载目录…</p></div>';
  try {
    const resp = await fetch('docs/index.json?t=' + Date.now());
    if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
    const raw = await resp.json();
    
    allFiles = raw.map(f => {
      let folder = f.folder || "";
      if (folder.startsWith('/')) folder = folder.slice(1);
      let url = f.url;
      if (!url.includes('/Files/')) url = url.replace('/FileDir/', '/FileDir/Files/');
      return {
        ...f,
        folder: folder,
        url: url,
        days: daysSince(f.date),
        ext: (f.ext || '').toLowerCase(),
        sizeBytes: parseSize(f.size)
      };
    });
    
    const folderSet = new Set();
    allFiles.forEach(f => {
      if (!f.folder) return;
      const parts = f.folder.split('/');
      let currentAcc = '';
      for (const p of parts) { currentAcc += (currentAcc === '' ? p : '/' + p); folderSet.add(currentAcc); }
    });
    allFolderPaths = [...folderSet];
    
    buildSidebar(); buildCatSidebar(); buildTopExtFilters(); updateCounts();
    
    fFolder = null; sideExt = ''; topExt = ''; searchQ = '';
    document.getElementById('searchInput').value = '';
    document.getElementById('clearSearch').style.display = 'none';
    
    updateBreadcrumb(); render();
    const recent = [...allFiles].sort((a,b) => a.days - b.days);
    renderRecentBar(recent.slice(0,6));
  } catch (err) {
    console.error(err);
    document.getElementById('fileList').innerHTML = `<div class="empty"><i class="ti ti-error"></i><p>加载失败: ${err.message}<br>请刷新页面重试</p></div>`;
  }
}

const si = document.getElementById('searchInput');
const cb = document.getElementById('clearSearch');
si.addEventListener('input', e => { searchQ = e.target.value; cb.style.display = searchQ ? 'block' : 'none'; render(); });
cb.onclick = () => { si.value = ''; searchQ = ''; cb.style.display = 'none'; render(); };

document.getElementById('extFilters').addEventListener('click', e => {
  const t = e.target.closest('.ext-tag'); if (!t) return;
  document.querySelectorAll('.ext-tag').forEach(x => x.classList.remove('active'));
  t.classList.add('active'); topExt = t.dataset.extTop; render();
});

init();
</script>
