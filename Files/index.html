<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Engineering Library Pro</title>

<style>
body {
    margin: 0;
    background: #0d1117;
    color: #c9d1d9;
    font-family: Segoe UI, Arial;
}

/* header */
.header {
    display: flex;
    justify-content: space-between;
    padding: 14px 20px;
    background: #161b22;
    border-bottom: 1px solid #30363d;
}

.title {
    font-weight: 600;
}

input {
    padding: 6px 10px;
    border-radius: 6px;
    border: 1px solid #30363d;
    background: #0d1117;
    color: #c9d1d9;
    width: 240px;
}

/* grid */
.grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
    gap: 12px;
    padding: 16px;
}

.card {
    background: #161b22;
    border: 1px solid #30363d;
    border-radius: 10px;
    padding: 12px;
    transition: 0.2s;
}

.card:hover {
    border-color: #58a6ff;
    transform: translateY(-2px);
}

a {
    color: #58a6ff;
    text-decoration: none;
    word-break: break-all;
}

/* tags */
.tag {
    display: inline-block;
    margin-top: 6px;
    font-size: 12px;
    padding: 2px 6px;
    border-radius: 4px;
}

.pdf { background:#3b1d1d; color:#ff7b72; }
.zip { background:#2b1a3b; color:#d2a8ff; }
.img { background:#1b2a3a; color:#79c0ff; }
.folder { background:#1b3a2a; color:#3fb950; }
.other { background:#2a2f3a; color:#8b949e; }

</style>
</head>

<body>

<div class="header">
    <div class="title">📁 Engineering Library Pro</div>
    <input id="search" placeholder="Search files...">
</div>

<div id="grid" class="grid"></div>

<script>

const grid = document.getElementById("grid");

/* 文件类型 */
function getType(name) {
    name = name.toLowerCase();
    if (name.endsWith(".pdf")) return "pdf";
    if (name.endsWith(".zip") || name.endsWith(".rar")) return "zip";
    if (name.endsWith(".png") || name.endsWith(".jpg")) return "img";
    if (!name.includes(".")) return "folder";
    return "other";
}

/* 渲染 */
function render() {
    document.querySelectorAll("a").forEach(a => {

        let name = a.innerText.trim();
        if (!name || name === "../") return;

        let type = getType(name);

        let card = document.createElement("div");
        card.className = "card";

        card.innerHTML = `
            <div>📄</div>
            <a href="${a.href}">${name}</a>
            <div class="tag ${type}">${type.toUpperCase()}</div>
        `;

        grid.appendChild(card);
    });
}

/* 搜索 */
document.getElementById("search").addEventListener("input", e => {
    let v = e.target.value.toLowerCase();
    document.querySelectorAll(".card").forEach(c => {
        c.style.display = c.innerText.toLowerCase().includes(v) ? "" : "none";
    });
});

/* 等待 GitHub Pages 目录生成 */
window.onload = () => {
    setTimeout(render, 300);
};

</script>

</body>
</html>
